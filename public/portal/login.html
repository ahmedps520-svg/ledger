<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Ledger — Sign in</title>
<meta name="theme-color" content="#12151C">
<link rel="manifest" href="/portal/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<div class="screen">
  <div class="login-wrap">
    <form class="login-card" id="portalLoginForm" autocomplete="on">
      <div class="login-seal">S</div>
      <h1>The Ledger</h1>
      <p class="sub">Sign in to see what you owe.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
      <div class="error-msg" id="formError"></div>
      <p class="login-alt">First time here? <a href="/portal/register.html">Set up your password</a></p>
    </form>
  </div>
</div>
<div id="toastRoot"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
