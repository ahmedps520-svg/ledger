<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Ledger — Set up your password</title>
<meta name="theme-color" content="#12151C">
<link rel="manifest" href="/portal/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<div class="screen">
  <div class="login-wrap">
    <form class="login-card" id="portalRegisterForm" autocomplete="on">
      <div class="login-seal">S</div>
      <h1>Set your password</h1>
      <p class="sub">Use the email address your subscriptions are tracked under. If it isn't recognised, ask to be added first.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Choose a password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="at least 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
      <div class="error-msg" id="formError"></div>
      <p class="login-alt">Already set up? <a href="/portal/login.html">Sign in</a></p>
    </form>
  </div>
</div>
<div id="toastRoot"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
